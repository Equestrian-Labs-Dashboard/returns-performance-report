<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Equestrian Labs — Returns Report</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=451" />
</head>
<body>
<aside class="sidebar">
  <div class="window-dots"><span></span><span></span></div>
  <img class="brand-logo" src="assets/corro_logo.png" alt="Corro" />
  <div class="sidebar-title">
    <strong>Equestrian Labs, Inc.</strong>
    <span>Performance Dashboard</span>
  </div>
  <div class="side-section">Returns</div>
  <nav class="side-nav">
    <a class="active" href="index.html">Returns Report</a>
  </nav>
  <div class="side-section">Brands</div>
  <div class="brand-chip"><span></span>Corro</div>
  <div class="brand-chip purple"><span></span>Cavali</div>
</aside>

<main class="report-shell">
  <div class="top-actions">
    <span class="live-pill">● Live</span>
    <button id="themeBtn" aria-label="Toggle theme">☾</button>
  </div>
  <section class="report-header">
    <div>
      <span class="pill" id="sourceStatus">Actuals loading...</span>
      <h1>Returns Performance</h1>
      <p>Shopify returns · Corro + Cavali · product ranking and reasons</p>
    </div>
    <div class="report-controls">
      <label>Period
        <select id="periodMode">
          <option value="ytd">YTD</option>
          <option value="q3">Q3</option>
          <option value="monthly">Monthly</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <label>Month
        <select id="monthSelect"></select>
      </label>
      <label>Start
        <input id="startMonth" type="month" value="2026-01" />
      </label>
      <label>End
        <input id="endMonth" type="month" value="2026-09" />
      </label>
      <label>Ranking
        <select id="rankLimit">
          <option value="auto">Auto</option>
          <option value="10">Top 10</option>
          <option value="20">Top 20</option>
          <option value="50">Top 50</option>
        </select>
      </label>
    </div>
  </section>

  <section class="section">
    <div class="section-title accent-green">KPI Summary</div>
    <div class="kpis" id="kpiSummary"></div>
  </section>

  <section class="return-layout">
    <div class="section">
      <div class="section-title accent-yellow">Top Returned Products</div>
      <div id="productTable"></div>
    </div>
    <div>
      <section class="section">
        <div class="section-title accent-purple">Returns by Category</div>
        <div class="card" id="categoryBars"></div>
      </section>
      <section class="section">
        <div class="section-title accent-orange">Returns by Vendor</div>
        <div class="card" id="vendorBars"></div>
      </section>
      <section class="section">
        <div class="section-title">Return Reasons</div>
        <div class="card" id="reasonBars"></div>
      </section>
    </div>
  </section>
</main>

<script src="assets/js/dataService.js?v=451"></script>
<script src="assets/js/returns.js?v=451"></script>
</body>
</html>
